/* ---------- Hooks & helpers ---------- */
function useInView(once = true) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (!("IntersectionObserver" in window)) { setSeen(true); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); if (once) io.disconnect(); } }, { threshold: 0.15 });
    io.observe(el); return () => io.disconnect();
  }, []);
  return [ref, seen];
}
function Reveal({ children, delay = 0, className = "", as: Tag = "div" }) {
  const [ref, seen] = useInView();
  return <Tag ref={ref} style={{ "--d": delay + "ms" }} className={`reveal ${seen ? "in" : ""} ${className}`}>{children}</Tag>;
}
function Img({ src, emoji, alt, className = "" }) {
  const [bad, setBad] = useState(false);
  if (bad) return <div role="img" aria-label={alt} className={`flex items-center justify-center text-6xl bg-gradient-to-br from-brand-100 to-amber-50 ${className}`}>{emoji}</div>;
  return <img src={IMG + src} alt={alt} onError={() => setBad(true)} className={className} />;
}
function Count({ to, suffix = "" }) {
  const [ref, seen] = useInView();
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!seen) return; let t0;
    const step = (t) => { t0 = t0 || t; const p = Math.min((t - t0) / 1400, 1); setN(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }, [seen]);
  return <span ref={ref}>{n}{suffix}</span>;
}

/* ---------- Cart drawer ---------- */
function CartDrawer({ open, close, cart, change, clear }) {
  const [name, setName] = useState(""); const [addr, setAddr] = useState(""); const [pay, setPay] = useState("Cash on Delivery (COD)"); const [err, setErr] = useState("");
  const total = cart.reduce((a, i) => a + i.price * i.qty, 0);
  const checkout = () => {
    if (!name.trim() || !addr.trim()) { setErr("Please enter your name and delivery address."); return; }
    const items = cart.map((it, k) => `${k + 1}. *${it.name}* (${it.size})\n   Qty: ${it.qty} | ₹${it.price * it.qty}`).join("\n");
    const msg = `*NEW ORDER - HARI ASH NATURAL* 🛒\n--------------------\n👤 *Name:* ${name}\n📍 *Address:* ${addr}\n💳 *Payment:* ${pay}\n--------------------\n*ITEMS:*\n${items}\n--------------------\n💰 *TOTAL:* ₹${total}\n_Please confirm availability and dispatch time._`;
    window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, "_blank");
  };
  useEffect(() => { document.body.style.overflow = open ? "hidden" : ""; const k = (e) => e.key === "Escape" && close(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [open]);
  return (
    <>
      <div onClick={close} className={`fixed inset-0 z-50 bg-black/50 backdrop-blur-sm transition-opacity duration-300 ${open ? "opacity-100" : "opacity-0 pointer-events-none"}`}></div>
      <aside aria-hidden={!open} className={`fixed top-0 right-0 z-50 h-full w-full sm:w-[420px] bg-white shadow-2xl flex flex-col transition-transform duration-300 ease-out ${open ? "translate-x-0" : "translate-x-full"}`}>
        <div className="p-5 border-b flex items-center justify-between bg-brand-50/60">
          <h3 className="font-bold text-lg flex items-center gap-2"><i className="fas fa-shopping-basket text-brand-600"></i> Your Order Basket</h3>
          <button onClick={close} aria-label="Close cart" className="text-gray-400 hover:text-gray-700 hover:rotate-90 transition p-1"><i className="fas fa-times text-xl"></i></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5">
          {!cart.length ? <div className="text-center py-16"><i className="fas fa-shopping-cart text-gray-300 text-5xl mb-3"></i><p className="text-gray-500 font-medium text-sm">Your cart is empty.</p><span className="text-xs text-gray-400">Add fresh products to proceed.</span></div>

            <div key={it.id} className="card-in flex items-center justify-between py-3 border-b border-gray-100">

              <div className="flex items-center gap-2 border border-gray-200 rounded-lg px-2 py-1 bg-white shadow-sm shrink-0">
                <button onClick={() => change(it.id, -1)} className="text-gray-500 hover:text-red-500 px-1 font-bold">−</button>
                <span className="text-xs font-bold w-4 text-center">{it.qty}</span>
                <button onClick={() => change(it.id, 1)} className="text-gray-500 hover:text-brand-600 px-1 font-bold">+</button>
              </div>
            </div>))}
        </div>
        {!!cart.length && (
          <div className="card-in p-5 border-t bg-gray-50/70 space-y-3">
            <div className="flex justify-between text-xs text-gray-600"><span>Delivery</span><span className="text-brand-600 font-semibold">Free (Local / Bulk)</span></div>
            <div className="flex justify-between text-base font-extrabold"><span>Total Payable</span><span className="text-brand-600">₹ {total}</span></div>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="Your Name *" className="w-full text-xs p-2.5 rounded-lg border border-gray-300 outline-none focus:ring-1 focus:ring-brand-500" />
            <input value={addr} onChange={e => setAddr(e.target.value)} placeholder="Delivery Address / City *" className="w-full text-xs p-2.5 rounded-lg border border-gray-300 outline-none focus:ring-1 focus:ring-brand-500" />
            <div className="flex gap-4 text-xs font-medium">{["Cash on Delivery (COD)","Online UPI / Scanner"].map(m => <label key={m} className="flex items-center gap-1.5 cursor-pointer"><input type="radio" checked={pay === m} onChange={() => setPay(m)} /> {m.split(" (")[0].replace(" / Scanner", "")}</label>)}</div>
            {err && <p className="text-xs text-red-600 font-medium">{err}</p>}
            <button onClick={checkout} className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg transition"><i className="fab fa-whatsapp text-xl"></i> Order via WhatsApp</button>

/* ---------- App ---------- */
function App() {

  const [filter, setFilter] = useState("all");
  const [query, setQuery] = useState("");
  const [toast, setToast] = useState("");
  const [bump, setBump] = useState(0);
  const tRef = useRef(null);
  useEffect(() => { try { localStorage.setItem("ha_cart", JSON.stringify(cart)); } catch {} }, [cart]);
  const say = (m) => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(""), 2200); };
  const addToCart = (p, size, price) => {
    const id = `${p.id}-${size}`;
    setCart(c => c.some(i => i.id === id) ? c.map(i => i.id === id ? { ...i, qty: i.qty + 1 } : i) : [...c, { id, name: p.name, size, price, qty: 1 }]);
    setBump(b => b + 1); say(`Added ${p.name} (${size}) to cart`);
  };
  const change = (id, d) => setCart(c => c.map(i => i.id === id ? { ...i, qty: i.qty + d } : i).filter(i => i.qty > 0));
  const toggleWish = (id) => setWishlist(w => { const has = w.includes(id); say(has ? "Removed from wishlist" : "Added to wishlist"); return has ? w.filter(x => x !== id) : [...w, id]; });
  const count = cart.reduce((a, i) => a + i.qty, 0);
  const total = cart.reduce((a, i) => a + i.price * i.qty, 0);

  return (
    <>
      <div className="bg-brand-900 text-brand-100 text-xs sm:text-sm py-2 px-4 text-center font-medium">
        <i className="fas fa-leaf text-brand-500 mr-1.5"></i> 100% Natural &amp; No Preservatives <span className="mx-2 hidden md:inline">|</span>
        <span className="hidden md:inline"><i className="fas fa-truck text-brand-500 mr-1.5"></i> Bulk Supply — Custom Packing <span className="mx-2">|</span></span>
        <a href={`https://wa.me/${WA}`} className="text-white font-semibold hover:underline"><i className="fab fa-whatsapp text-emerald-400 mr-1"></i>8952919243</a>
      </div>
      <Header cartCount={count} wish={wishlist.length} query={query} setQuery={setQuery} openCart={() => setOpen(true)} bump={bump} />
      <main>
        <Hero /><Features />
        <Categories goFilter={setFilter} />
        <Products filter={filter} setFilter={setFilter} query={query} addToCart={addToCart} wishlist={wishlist} toggleWish={toggleWish} />
        <Organic /><Bulk /><Why /><Testimonials /><Contact />
      </main>
      <Footer />

      <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-3">
        <a href={`https://wa.me/${WA}?text=${encodeURIComponent("Hi, I want to order from Hari Ash Natural Organics")}`} target="_blank" rel="noreferrer" aria-label="Chat on WhatsApp" className="w-12 h-12 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full flex items-center justify-center text-2xl shadow-xl hover:scale-110 transition"><i className="fab fa-whatsapp"></i></a>
        <button onClick={() => setOpen(true)} className={`flex items-center gap-2.5 bg-brand-600 hover:bg-brand-700 text-white px-5 py-3 rounded-full shadow-2xl hover:scale-105 transition-all duration-300 ${count ? "translate-y-0 opacity-100" : "translate-y-24 opacity-0 pointer-events-none"}`}>
          <i className="fas fa-shopping-bag"></i><span className="font-bold text-sm">₹ {total}</span>
          <span key={bump} className="pop bg-white text-brand-700 font-extrabold text-xs px-2 py-0.5 rounded-full">{count}</span>
        </button>
      </div>

      <CartDrawer open={open} close={() => setOpen(false)} cart={cart} change={change} clear={() => setCart([])} />
      <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900/95 text-white px-5 py-2.5 rounded-full text-xs font-semibold shadow-xl pointer-events-none transition-all duration-300 ${toast ? "opacity-100 translate-y-0" : "opacity-0 translate-y-4"}`} role="status">{toast}</div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
